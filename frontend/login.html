<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Trading-Tool – Anmeldung</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; display: grid; place-items: center;
    background: #0e1117; color: #c9d1d9;
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  form {
    width: min(360px, calc(100vw - 32px)); padding: 28px;
    background: #161b22; border: 1px solid #30363d; border-radius: 12px;
  }
  h1 { margin: 0 0 20px; font-size: 20px; font-weight: 600; }
  input, button {
    width: 100%; padding: 11px 12px; font-size: 16px; border-radius: 8px;
    border: 1px solid #30363d; background: #0e1117; color: inherit;
  }
  input:focus { outline: 2px solid #2f81f7; outline-offset: -1px; }
  button {
    margin-top: 12px; background: #2f81f7; border-color: #2f81f7;
    color: #fff; font-weight: 600; cursor: pointer;
  }
  button:disabled { opacity: .6; cursor: default; }
  #msg { min-height: 20px; margin-top: 12px; font-size: 14px; color: #f85149; }
</style>
</head>
<body>
<form id="f">
  <h1>Trading-Tool</h1>
  <input id="pw" type="password" placeholder="Passwort" autocomplete="current-password" autofocus required>
  <button id="btn" type="submit">Anmelden</button>
  <div id="msg" role="alert"></div>
</form>
<script>
  const f = document.getElementById('f');
  const msg = document.getElementById('msg');
  const btn = document.getElementById('btn');
  f.addEventListener('submit', async (e) => {
    e.preventDefault();
    msg.textContent = '';
    btn.disabled = true;
    try {
      const r = await fetch('/api/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ password: document.getElementById('pw').value })
      });
      if (r.ok) { location.href = '/'; return; }
      const d = await r.json().catch(() => ({}));
      msg.textContent = d.detail || 'Anmeldung fehlgeschlagen';
    } catch (err) {
      msg.textContent = 'Server nicht erreichbar';
    }
    btn.disabled = false;
  });
</script>
</body>
</html>
