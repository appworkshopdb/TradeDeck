services:
  app:
    build: .
    restart: unless-stopped
    env_file: .env
    expose:
      - "8000"   # nur intern im Docker-Netz, nicht nach außen veröffentlicht

  caddy:
    image: caddy:2
    restart: unless-stopped
    depends_on:
      - app
    ports:
      - "80:80"
      - "443:443"
    environment:
      - DOMAIN=${DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  caddy_data:
  caddy_config:
